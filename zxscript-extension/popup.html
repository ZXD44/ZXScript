<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      background: #09090b;
      color: #f4f4f5;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 9px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 10px;
    }
    .title-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .title {
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #fafafa;
    }
    .ver {
      font-size: 9px;
      color: #71717a;
      font-weight: 500;
      padding: 1px 5px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .author {
      font-size: 9.5px;
      color: #71717a;
      font-weight: 500;
    }

    /* Status Screen Box */
    .screen-box {
      background: #111114;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 11px 12px;
      margin-bottom: 10px;
    }
    .screen-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .screen-title {
      font-size: 9px;
      font-weight: 600;
      color: #71717a;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #52525b;
      display: inline-block;
      transition: all 0.2s ease;
    }
    .dot.on {
      background: #10b981;
      box-shadow: 0 0 6px rgba(16, 185, 129, 0.5);
    }
    .dot.warn {
      background: #f59e0b;
      box-shadow: 0 0 6px rgba(245, 158, 11, 0.5);
    }

    .status-main {
      font-size: 12px;
      font-weight: 500;
      color: #fafafa;
      margin-bottom: 10px;
      line-height: 1.4;
      display: flex;
      align-items: center;
    }
    .zs-dots {
      display: inline-flex;
      margin-left: 2px;
      letter-spacing: 1px;
    }
    .zs-dots span {
      animation: zs-dots-pulse 1.4s infinite ease-in-out both;
    }
    .zs-dots span:nth-child(1) { animation-delay: -0.32s; }
    .zs-dots span:nth-child(2) { animation-delay: -0.16s; }
    .zs-dots span:nth-child(3) { animation-delay: 0s; }
    @keyframes zs-dots-pulse {
      0%, 80%, 100% { opacity: 0.25; }
      40% { opacity: 1; }
    }

    .screen-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    .screen-row {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .screen-label {
      color: #71717a;
      font-size: 9px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .screen-val {
      color: #d4d4d8;
      font-weight: 500;
      font-size: 10.5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    /* Controls */
    .runner-controls {
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    button {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.04);
      color: #e4e4e7;
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    button:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.14);
      color: #ffffff;
    }
    button:active {
      transform: scale(0.99);
    }
    .btn-primary {
      background: #fafafa;
      color: #09090b;
      font-weight: 600;
      border-color: transparent;
    }
    .btn-primary:hover {
      background: #f4f4f5;
      color: #000000;
    }
    .btn-row {
      display: flex;
      gap: 6px;
    }
    .btn-row button {
      flex: 1;
      font-size: 10.5px;
    }
    .btn-muted {
      color: #a1a1aa;
    }
    .btn-muted:hover {
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.25);
    }

    .autostart-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 9.5px;
      color: #71717a;
      cursor: pointer;
      padding: 1px 2px;
    }
    .autostart-toggle input {
      width: 12px;
      height: 12px;
      cursor: pointer;
      accent-color: #6366f1;
    }

    /* Segmented Navigation */
    .nav-seg {
      display: flex;
      gap: 2px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 6px;
      padding: 2px;
      margin-bottom: 8px;
    }
    .seg-btn {
      flex: 1;
      padding: 5px 6px;
      font-size: 10px;
      font-weight: 500;
      color: #71717a;
      background: transparent;
      border: none;
      border-radius: 4px;
    }
    .seg-btn:hover {
      color: #d4d4d8;
      background: rgba(255, 255, 255, 0.03);
    }
    .seg-btn.active {
      color: #fafafa;
      background: rgba(255, 255, 255, 0.08);
      font-weight: 600;
    }

    .seg-pane {
      display: none;
    }
    .seg-pane.active {
      display: block;
    }

    /* AI Grid */
    .ai-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 6px;
    }
    .ai-btn {
      padding: 8px 6px;
      font-size: 11px;
      text-align: center;
      flex-direction: row;
      justify-content: center;
      gap: 5px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .ai-btn span.badge {
      font-size: 8px;
      color: #10b981;
      font-weight: 500;
      padding: 1px 4px;
      background: rgba(16, 185, 129, 0.1);
      border-radius: 3px;
    }

    /* Search & Tools List */
    .search-box {
      width: 100%;
      padding: 6px 9px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 5px;
      color: #f4f4f5;
      font-size: 10.5px;
      outline: none;
      margin-bottom: 6px;
    }
    .search-box:focus {
      border-color: rgba(255, 255, 255, 0.2);
    }
    .tools-list {
      max-height: 120px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-right: 2px;
    }
    .tool-item {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      padding: 5px 7px;
    }
    .tool-name {
      font-size: 10px;
      font-weight: 600;
      color: #d4d4d8;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .tool-desc {
      font-size: 9.5px;
      color: #71717a;
      line-height: 1.3;
      margin-top: 1px;
    }

    /* Prompt Form */
    textarea.prompt-box {
      width: 100%;
      height: 60px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 5px;
      color: #f4f4f5;
      font-size: 10px;
      font-family: inherit;
      padding: 6px 8px;
      resize: none;
      outline: none;
      margin-bottom: 6px;
      user-select: text;
    }
    textarea.prompt-box:focus {
      border-color: rgba(255, 255, 255, 0.2);
    }
    .feedback-msg {
      font-size: 9.5px;
      color: #10b981;
      font-weight: 500;
      min-height: 14px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title-group">
      <img src="icon-16.png" width="14" height="14" style="border-radius: 3px;" alt="" />
      <span class="title">ZXScript</span>
      <span id="ver" class="ver"></span>
    </div>
    <a href="https://www.zirconx.my" target="_blank" rel="noopener" class="author" style="text-decoration: none; color: #a1a1aa; display: flex; align-items: center; gap: 4px; transition: color 0.15s;" title="เยี่ยมชมเว็บไซต์ www.zirconx.my">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
      zirconx.my
    </a>
  </div>

  <!-- STATUS MONITOR SCREEN -->
  <div class="screen-box">
    <div class="screen-header">
      <span class="screen-title">สถานะระบบ</span>
      <span id="screen-dot" class="dot"></span>
    </div>

    <div id="screen-state" class="status-main">กำลังตรวจสอบสถานะ…</div>

    <div class="screen-grid">
      <div class="screen-row">
        <span class="screen-label">Bridge Server</span>
        <span id="val-bridge" class="screen-val">127.0.0.1:17613</span>
      </div>
      <div class="screen-row">
        <span class="screen-label">Roblox Studio</span>
        <span id="val-studio" class="screen-val">Bloxstrap MCP</span>
      </div>
      <div class="screen-row">
        <span class="screen-label">คำสั่งพร้อมใช้งาน</span>
        <span id="val-tools" class="screen-val">0 รายการ</span>
      </div>
      <div class="screen-row">
        <span class="screen-label">เริ่มตอนเปิดเครื่อง</span>
        <span id="val-autostart" class="screen-val">พร้อมใช้งาน</span>
      </div>
    </div>
  </div>

  <!-- RUNNER CONTROLS -->
  <div class="runner-controls">
    <button id="btn-run-bridge" class="btn-primary">เริ่มการทำงาน Bridge</button>

    <div id="online-actions" class="btn-row" style="display: none;">
      <button id="btn-stop-bridge" class="btn-muted">หยุดทำงาน</button>
      <button id="btn-restart-bridge">รีสตาร์ตเซิร์ฟเวอร์</button>
      <button id="btn-refresh-state">รีเฟรช</button>
    </div>

    <label class="autostart-toggle">
      <input type="checkbox" id="chk-autostart" />
      <span>เริ่มทำงานอัตโนมัติเมื่อเปิดเครื่อง</span>
    </label>
  </div>

  <!-- SEGMENTED NAVIGATION -->
  <div class="nav-seg">
    <button class="seg-btn active" data-pane="pane-ai">โมเดล AI</button>
    <button class="seg-btn" data-pane="pane-tools">เครื่องมือ (31)</button>
    <button class="seg-btn" data-pane="pane-prompt">คำสั่งระบบ</button>
  </div>

  <!-- PANE 1: AI MODELS -->
  <div id="pane-ai" class="seg-pane active">
    <div class="ai-grid">
      <button class="ai-btn" data-url="https://chat.deepseek.com/" data-host="chat.deepseek.com">
        <span>DeepSeek</span>
        <span class="badge">แนะนำ</span>
      </button>
      <button class="ai-btn" data-url="https://chatgpt.com/" data-host="chatgpt.com">
        <span>ChatGPT</span>
      </button>
      <button class="ai-btn" data-url="https://gemini.google.com/" data-host="gemini.google.com">
        <span>Gemini</span>
      </button>
      <button class="ai-btn" data-url="https://chat.qwen.ai/" data-host="chat.qwen.ai">
        <span>Qwen</span>
      </button>
    </div>
    <button id="btn-open-overlay" style="font-size: 10px; padding: 5px;">
      เปิดแถบควบคุมบนแท็บปัจจุบัน
    </button>
  </div>

  <!-- PANE 2: TOOLS -->
  <div id="pane-tools" class="seg-pane">
    <input type="text" id="tool-search" class="search-box" placeholder="ค้นหาคำสั่ง เช่น execute_luau..." />
    <div id="tools-box" class="tools-list">
      <!-- Injected by popup.js -->
    </div>
  </div>

  <!-- PANE 3: PROMPT / CAVEMAN -->
  <div id="pane-prompt" class="seg-pane">
    <div style="margin-bottom: 6px;">
      <select id="sel-template" style="width: 100%; padding: 5px 8px; background: #111114; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 5px; color: #d4d4d8; font-size: 10px; outline: none; cursor: pointer;">
        <option value="">-- เลือกเทมเพลตคำสั่งระบบ (1-Click) --</option>
        <option value="rules">กฎเหล็ก 5 ข้อ Roblox AI (ความปลอดภัย & กันโดนแบน)</option>
        <option value="caveman">Caveman Mode (กระชับ ประหยัด token สูงสุด)</option>
        <option value="datastore">ProfileStore Data Persistence (บันทึกข้อมูลปลอดภัย)</option>
        <option value="leaderstats">Leaderstats & Currency (ระบบเงิน/สถิติผู้เล่น)</option>
        <option value="inventory">Inventory & Shop UI (กระเป๋าและร้านค้าไอเทม)</option>
        <option value="raycast_combat">Raycast Combat System (ระบบต่อสู้/อาวุธยิง)</option>
        <option value="npc_ai">NPC Pathfinding & AI (บอทเดินตรวจการณ์/ไล่ล่า)</option>
      </select>
    </div>

    <textarea id="prompt-input" class="prompt-box" placeholder="คำสั่งเพิ่มเติมสำหรับส่งให้ AI ทุกรอบ..."></textarea>
    <div class="btn-row">
      <button id="btn-rules">กฎเหล็ก 5 ข้อ</button>
      <button id="btn-caveman">โหมด Caveman</button>
      <button id="btn-rest" style="color: #10b981; border-color: rgba(16, 185, 129, 0.25);">พักผ่อน/บันทึก</button>
    </div>
    <div style="margin-top: 6px;">
      <button id="btn-save-prompt" class="btn-primary" style="padding: 6px 10px;">
        บันทึกการตั้งค่า
      </button>
    </div>
  </div>

  <div id="toast-msg" class="feedback-msg"></div>

  <script src="popup.js"></script>
</body>
</html>
